# WeShop CI：生产依赖审计 → lint → 类型检查 → Web/小程序构建 → 全量测试
# Web 的类型检查含在 build 内，pnpm test 包含 API、小程序、Web 单测及 API 自包含冒烟
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自根 package.json 的 packageManager 字段，这里不手写版本
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod

      # 存量代码有 warning 无 error，不要加 --max-warnings 0
      - run: pnpm -r lint

      - run: pnpm typecheck

      - run: pnpm build:web

      - run: pnpm --filter miniprogram build:weapp

      # 自包含 API 冒烟：临时端口 7821 + 临时 SQLite 库，跑完自动清理
      - run: pnpm test
