# WeShop CI：生产依赖审计 → lint → 类型检查 → Web/小程序构建 → MySQL 测试
# Web 的类型检查含在 build 内；API 冒烟使用独立 MySQL 临时数据库
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: weshop-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pweshop-ci-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自根 package.json 的 packageManager 字段，这里不手写版本
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod

      # 存量代码有 warning 无 error，不要加 --max-warnings 0
      - run: pnpm -r lint

      - run: pnpm typecheck

      - run: pnpm build:web

      - run: pnpm --filter miniprogram build:weapp

      # 使用独立 MySQL 临时数据库，跑完自动清理
      - run: pnpm test
        env:
          API_MYSQL_HOST: 127.0.0.1
          API_MYSQL_PORT: 3306
          API_MYSQL_USER: root
          API_MYSQL_PASSWORD: weshop-ci-only
